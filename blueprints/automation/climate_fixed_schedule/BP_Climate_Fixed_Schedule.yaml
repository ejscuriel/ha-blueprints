# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ BLUEPRINT: Aire acondicionado — perfil obligatorio + 5 cambios programados ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  Una instancia controla una sola entidad climate.                          ║
# ║                                                                            ║
# ║  · Cualquier transición desde off/unknown/unavailable a un modo activo     ║
# ║    aplica el perfil inicial. Esto incluye cool, dry, auto, fan_only, heat  ║
# ║    y cualquier otro modo que exponga la integración.                       ║
# ║  · El modo HVAC elegido se aplica con cada perfil.                         ║
# ║  · Hasta cinco horas opcionales cambian el perfil si el aire sigue activo. ║
# ║  · Los modos de ventilador y oscilación admiten valores personalizados.    ║
# ║  · Al finalizar verifica el resultado y registra cualquier problema.       ║
# ║                                                                            ║
# ║  Autor       : Eduardo Sánchez Curiel — EVOTECH LTDA                       ║
# ║  Versión     : 1.4.0                                                       ║
# ║  Fecha       : 2026-09-07                                                  ║
# ║  Licencia    : MIT                                                         ║
# ║  Requisitos  : Home Assistant 2026.1.0 o superior                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

blueprint:
  name: Aire acondicionado — perfil obligatorio y hasta 5 horarios
  description: |
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**

    Aplica un perfil fijo cada vez que una unidad de aire pasa de apagada a
    cualquier modo activo. El disparo no depende del modo usado para encender:
    incluye `cool`, `dry`, `auto`, `fan_only`, `heat` y cualquier otro estado
    activo que reporte la integración.

    Después de permanecer encendida durante un minuto, la unidad recibe el
    perfil inicial completo. El modo HVAC seleccionado se vuelve a aplicar con
    cada perfil programado.

    También admite hasta cinco cambios programados. Cada horario es opcional y
    solo actúa si la unidad continúa encendida en la hora exacta configurada.
    Para usar menos de cinco, deja desactivados los horarios restantes.

    Se recomienda crear una automatización independiente por cada unidad. Los
    valores de ventilador y oscilación dependen de la integración: selecciona
    una opción común o escribe exactamente el valor publicado por la entidad.

    Cada instancia funciona en `mode: single`: una unidad nunca ejecuta dos
    perfiles al mismo tiempo. Las instancias creadas para otros aires son
    automatizaciones independientes. Si dos eventos de una misma unidad se
    superponen, Home Assistant conserva la ejecución en curso y deja una
    advertencia en el registro.

    Si la entidad está `unknown` o `unavailable`, no envía órdenes de control y
    registra la omisión. Después de cada perfil espera la actualización del
    equipo, compara los valores recibidos y escribe en el registro cualquier
    modo, temperatura, ventilador u oscilación que no se haya aplicado.

    Por defecto solo se envían los parámetros cuyo valor necesita cambiar, para
    evitar pitidos innecesarios. Cada perfil tiene una opción de reenvío
    obligatorio que permite transmitir sus valores aunque ya coincidan; las
    opciones marcadas como `No modificar` nunca se envían.

    Los valores precargados reproducen el perfil vigente de la unidad de
    Eduardo. Los cinco horarios permanecen desactivados hasta que el usuario
    habilite expresamente los que quiera utilizar.

    **Versión 1.4.0**

  domain: automation
  homeassistant:
    min_version: "2026.1.0"
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/climate_fixed_schedule/BP_Climate_Fixed_Schedule.yaml"

  input:
    unidad_y_control:
      name: "❄️ Unidad y control obligatorio"
      icon: mdi:air-conditioner
      collapsed: false
      input:
        entidad_clima:
          name: Unidad de aire acondicionado
          description: Entidad `climate.*` que controlará esta automatización.
          selector:
            entity:
              filter:
                - domain: climate
              multiple: false

        modo_hvac_forzado:
          name: Modo HVAC obligatorio
          description: >
            Modo que se aplicará en el perfil inicial y en todos los perfiles
            horarios.
          default: cool
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: Frío (cool)
                  value: cool
                - label: Seco / deshumidificar (dry)
                  value: dry
                - label: Automático (auto)
                  value: auto
                - label: Solo ventilador (fan_only)
                  value: fan_only
                - label: Calor (heat)
                  value: heat
                - label: Frío/calor automático (heat_cool)
                  value: heat_cool

        pausa_entre_ordenes:
          name: Pausa entre órdenes
          description: >
            Separación entre las órdenes de modo, temperatura, ventilador y
            oscilación. Es útil para equipos controlados por nube o infrarrojo.
          default:
            hours: 0
            minutes: 0
            seconds: 1
          selector:
            duration:
              enable_day: false
              enable_millisecond: false

        acciones_adicionales:
          name: Acciones adicionales
          description: >
            Opcional. Permite conservar acciones asociadas, por ejemplo encender
            la luz del display del aire de Eduardo. Se ejecutan después de los
            perfiles elegidos en el campo siguiente.
          default: []
          selector:
            action:

        ejecutar_acciones_adicionales_en:
          name: Ejecutar las acciones adicionales en
          description: >
            Selecciona los eventos que también deben ejecutar las acciones
            adicionales. Los valores precargados reproducen el uso actual del
            display de Eduardo.
          default:
            - aire_encendido
            - horario_1
            - horario_2
          selector:
            select:
              mode: list
              multiple: true
              options:
                - label: Perfil inicial al encender
                  value: aire_encendido
                - label: Horario 1
                  value: horario_1
                - label: Horario 2
                  value: horario_2
                - label: Horario 3
                  value: horario_3
                - label: Horario 4
                  value: horario_4
                - label: Horario 5
                  value: horario_5

    perfil_inicial:
      name: "🎯 Perfil obligatorio al encender"
      icon: mdi:tune-variant
      collapsed: false
      input:
        forzar_reenvio_inicial:
          name: Reenviar el perfil inicial aunque ya coincida
          description: >
            Desactivado evita órdenes y pitidos innecesarios. Activado vuelve a
            enviar cada parámetro configurado, aunque el estado actual sea igual.
          default: false
          selector:
            boolean:

        temperatura_inicial:
          name: Temperatura inicial
          description: >
            Usa la unidad configurada en Home Assistant. Por ejemplo, 20 para
            20 °C o 68 para 68 °F.
          default: 21
          selector:
            number:
              min: 5
              max: 100
              step: 0.5
              mode: box

        ventilador_inicial:
          name: Ventilador inicial
          description: >
            Los nombres son sensibles a mayúsculas. Usa "No modificar" si la
            integración no permite controlar esta opción.
          default: low
          selector: &selector_ventilador
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: No modificar
                  value: __no_change__
                - label: Automático (auto)
                  value: auto
                - label: Bajo (low)
                  value: low
                - label: Bajo-medio (LOW_MID)
                  value: LOW_MID
                - label: Medio (medium)
                  value: medium
                - label: Medio-alto (MID_HIGH)
                  value: MID_HIGH
                - label: Alto (high)
                  value: high
                - label: Silencioso (quiet)
                  value: quiet
                - label: Turbo (turbo)
                  value: turbo

        oscilacion_vertical_inicial:
          name: Oscilación vertical inicial
          description: Selecciona una opción o escribe el valor exacto de `swing_modes`.
          default: Bottom
          selector: &selector_vertical
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: No modificar
                  value: __no_change__
                - label: Arriba (Top)
                  value: Top
                - label: Medio-arriba 1 (MiddleTop1)
                  value: MiddleTop1
                - label: Medio-arriba 2 (MiddleTop2)
                  value: MiddleTop2
                - label: Medio-abajo 2 (MiddleBottom2)
                  value: MiddleBottom2
                - label: Medio-abajo 1 (MiddleBottom1)
                  value: MiddleBottom1
                - label: Abajo (Bottom)
                  value: Bottom
                - label: Oscilar (swing)
                  value: swing
                - label: Sin oscilación (off)
                  value: "off"

        oscilacion_horizontal_inicial:
          name: Oscilación horizontal inicial
          description: >
            Selecciona una opción o escribe el valor exacto de
            `swing_horizontal_modes`.
          default: MiddleRight
          selector: &selector_horizontal
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: No modificar
                  value: __no_change__
                - label: Izquierda (Left)
                  value: Left
                - label: Medio-izquierda (MiddleLeft)
                  value: MiddleLeft
                - label: Centro (Center)
                  value: Center
                - label: Medio-derecha (MiddleRight)
                  value: MiddleRight
                - label: Derecha (Right)
                  value: Right
                - label: Mitad izquierda (LeftHalf)
                  value: LeftHalf
                - label: Mitad derecha (RightHalf)
                  value: RightHalf
                - label: Oscilar (swing)
                  value: swing
                - label: Sin oscilación (off)
                  value: "off"

    horario_1:
      name: "🕐 Horario 1"
      icon: mdi:clock-outline
      collapsed: true
      input:
        habilitar_horario_1:
          name: Usar horario 1
          default: false
          selector:
            boolean:
        forzar_reenvio_horario_1:
          name: Reenviar perfil 1 aunque ya coincida
          description: Puede producir un pitido por cada parámetro configurado.
          default: false
          selector:
            boolean:
        hora_horario_1:
          name: Hora 1
          default: "22:00:00"
          selector:
            time:
        temperatura_horario_1:
          name: Temperatura 1
          default: 22
          selector: &selector_temperatura
            number:
              min: 5
              max: 100
              step: 0.5
              mode: box
        ventilador_horario_1:
          name: Ventilador 1
          default: low
          selector: *selector_ventilador
        oscilacion_vertical_horario_1:
          name: Oscilación vertical 1
          default: Bottom
          selector: *selector_vertical
        oscilacion_horizontal_horario_1:
          name: Oscilación horizontal 1
          default: MiddleRight
          selector: *selector_horizontal

    horario_2:
      name: "🕑 Horario 2"
      icon: mdi:clock-outline
      collapsed: true
      input:
        habilitar_horario_2:
          name: Usar horario 2
          default: false
          selector:
            boolean:
        forzar_reenvio_horario_2:
          name: Reenviar perfil 2 aunque ya coincida
          description: Puede producir un pitido por cada parámetro configurado.
          default: false
          selector:
            boolean:
        hora_horario_2:
          name: Hora 2
          default: "00:00:00"
          selector:
            time:
        temperatura_horario_2:
          name: Temperatura 2
          default: 23
          selector: *selector_temperatura
        ventilador_horario_2:
          name: Ventilador 2
          default: low
          selector: *selector_ventilador
        oscilacion_vertical_horario_2:
          name: Oscilación vertical 2
          default: Bottom
          selector: *selector_vertical
        oscilacion_horizontal_horario_2:
          name: Oscilación horizontal 2
          default: MiddleRight
          selector: *selector_horizontal

    horario_3:
      name: "🕒 Horario 3"
      icon: mdi:clock-outline
      collapsed: true
      input:
        habilitar_horario_3:
          name: Usar horario 3
          default: false
          selector:
            boolean:
        forzar_reenvio_horario_3:
          name: Reenviar perfil 3 aunque ya coincida
          description: Puede producir un pitido por cada parámetro configurado.
          default: false
          selector:
            boolean:
        hora_horario_3:
          name: Hora 3
          default: "01:00:00"
          selector:
            time:
        temperatura_horario_3:
          name: Temperatura 3
          default: 23
          selector: *selector_temperatura
        ventilador_horario_3:
          name: Ventilador 3
          default: low
          selector: *selector_ventilador
        oscilacion_vertical_horario_3:
          name: Oscilación vertical 3
          default: Bottom
          selector: *selector_vertical
        oscilacion_horizontal_horario_3:
          name: Oscilación horizontal 3
          default: MiddleRight
          selector: *selector_horizontal

    horario_4:
      name: "🕓 Horario 4"
      icon: mdi:clock-outline
      collapsed: true
      input:
        habilitar_horario_4:
          name: Usar horario 4
          default: false
          selector:
            boolean:
        forzar_reenvio_horario_4:
          name: Reenviar perfil 4 aunque ya coincida
          description: Puede producir un pitido por cada parámetro configurado.
          default: false
          selector:
            boolean:
        hora_horario_4:
          name: Hora 4
          default: "03:00:00"
          selector:
            time:
        temperatura_horario_4:
          name: Temperatura 4
          default: 24
          selector: *selector_temperatura
        ventilador_horario_4:
          name: Ventilador 4
          default: low
          selector: *selector_ventilador
        oscilacion_vertical_horario_4:
          name: Oscilación vertical 4
          default: Bottom
          selector: *selector_vertical
        oscilacion_horizontal_horario_4:
          name: Oscilación horizontal 4
          default: MiddleRight
          selector: *selector_horizontal

    horario_5:
      name: "🕔 Horario 5"
      icon: mdi:clock-outline
      collapsed: true
      input:
        habilitar_horario_5:
          name: Usar horario 5
          default: false
          selector:
            boolean:
        forzar_reenvio_horario_5:
