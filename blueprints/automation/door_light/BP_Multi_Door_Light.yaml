  d10: !input dispositivo_10
  a10: !input tiempo_abierto_10
  c10: !input tiempo_cerrado_10
  m10: !input tiempo_manual_10

  # Lista de parejas activas — selectattr('p') descarta las no configuradas
  parejas: >
    {% set raw = [
      {'p': p1,  'd': d1,  'a': a1,  'c': c1,  'm': m1 },
      {'p': p2,  'd': d2,  'a': a2,  'c': c2,  'm': m2 },
      {'p': p3,  'd': d3,  'a': a3,  'c': c3,  'm': m3 },
      {'p': p4,  'd': d4,  'a': a4,  'c': c4,  'm': m4 },
      {'p': p5,  'd': d5,  'a': a5,  'c': c5,  'm': m5 },
      {'p': p6,  'd': d6,  'a': a6,  'c': c6,  'm': m6 },
      {'p': p7,  'd': d7,  'a': a7,  'c': c7,  'm': m7 },
      {'p': p8,  'd': d8,  'a': a8,  'c': c8,  'm': m8 },
      {'p': p9,  'd': d9,  'a': a9,  'c': c9,  'm': m9 },
      {'p': p10, 'd': d10, 'a': a10, 'c': c10, 'm': m10},
    ] %}
    {{ raw | selectattr('p') | list }}

# ────────────────────────────────────────────────────────────────────────────
#  TRIGGER
#  Escucha state_changed global. El filtrado ocurre en las condiciones.
#  Se detectan tres tipos de eventos:
#    1. Sensor de puerta → on  (puerta abre)
#    2. Sensor de puerta → off (puerta cierra)
#    3. Dispositivo      → on  (encendido manual)
# ────────────────────────────────────────────────────────────────────────────
trigger:
  - platform: event
    event_type: state_changed

# ────────────────────────────────────────────────────────────────────────────
#  CONDICIONES
# ────────────────────────────────────────────────────────────────────────────
condition:

  # 1. Protección: old_state y new_state deben existir
  #    Evita crash cuando HA añade/elimina entidades en caliente
  - condition: template
    value_template: >
      {{ trigger.event.data.old_state is not none and
         trigger.event.data.new_state is not none }}

  # 2. La entidad pertenece a alguna pareja activa
  #    — ya sea el sensor de puerta O el dispositivo asociado
  - condition: template
    value_template: >
      {% set eid        = trigger.event.data.entity_id %}
      {% set puertas    = parejas | map(attribute='p') | list %}
      {% set dispositivos = parejas | map(attribute='d') | list %}
      {{ eid in puertas or eid in dispositivos }}

  # 3. Estado cambió y es válido (on/off)
  #    Descarta: unavailable, unknown, cambios de atributos sin cambio de estado
  - condition: template
    value_template: >
      {% set ns = trigger.event.data.new_state.state %}
      {% set os = trigger.event.data.old_state.state %}
      {{ ns != os and ns in ['on', 'off'] }}

# ────────────────────────────────────────────────────────────────────────────
#  ACCIÓN
#
#  Para cada pareja evalúa cuál de los tres casos ocurrió:
#
#  CASO A — Puerta ABRE (sensor → on):
#    Enciende el dispositivo. Sin timer automático: permanece encendido
#    hasta que la puerta se cierre (CASO B) o acción manual.
#
#  CASO B — Puerta CIERRA (sensor → off):
#    Espera t_ce segundos y apaga. Si t_ce = -1, queda encendido.
#    Si t_ce = 0, apaga inmediatamente.
#    Verificación post-delay: apaga solo si la puerta sigue cerrada
#    (si volvió a abrirse, el CASO A tomará control).
#
#  CASO C — Dispositivo encendido manualmente (dispositivo → on):
#    Comprueba el estado actual de la puerta:
#    · Puerta ABIERTA → espera t_ab → apaga (usuario entró con puerta abierta)
#    · Puerta CERRADA → espera t_mc → apaga (usuario encendió con puerta cerrada)
#    En ambos casos, si el tiempo es -1, no apaga automáticamente.
# ────────────────────────────────────────────────────────────────────────────
action:
  - variables:
      eid:       "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state.state }}"
      auto_name: "{{ this.attributes.friendly_name | default(this.entity_id) }}"

  - repeat:
      for_each: "{{ parejas }}"
      sequence:

        - variables:
            p:    "{{ repeat.item.p }}"
            d:    "{{ repeat.item.d }}"
            t_ab: "{{ repeat.item.a | int }}"
            t_ce: "{{ repeat.item.c | int }}"
            t_mc: "{{ repeat.item.m | int }}"
            par:  "{{ repeat.index }}"

        - choose:

            # ════════════════════════════════════════════════════════════════
            #  CASO A — PUERTA ABRE → encender dispositivo (sin timer)
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'on' }}"
              sequence:
                # Protección: verificar disponibilidad del sensor antes de actuar
                - if:
                    - "{{ states(p) in ['unavailable', 'unknown'] }}"
                  then:
                    - service: system_log.write
                      data:
                        level: warning
                        logger: "blueprint.door_light"
                        message: >
                          [{{ auto_name }}] Pareja {{ par }} — OMITIDO Puerta ABRE:
                          Sensor '{{ p }}' no disponible ({{ states(p) }}).
                          Acción: verifica batería o conectividad del sensor.
                  else:
                    # Verificar que el dispositivo esté disponible antes de comandar
                    - if:
                        - "{{ states(d) in ['unavailable', 'unknown'] }}"
                      then:
                        - service: system_log.write
                          data:
                            level: warning
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — OMITIDO Puerta ABRE:
                              Dispositivo '{{ d }}' no disponible ({{ states(d) }}).
                              Acción: verifica conectividad del dispositivo.
                      else:
                        # Puerta abre → encender + timer t_ab
                        - service: homeassistant.turn_on
                          target:
                            entity_id: "{{ d }}"
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Puerta ABIERTA →
                              '{{ d }}' encendido.
                              t_ab: {{ 'ilimitado' if t_ab == -1 else t_ab | string ~ 's' }}.

                        # Timer t_ab: -1 = ilimitado (no apaga) | 0 = inmediato | >0 = espera
                        - if:
                            - "{{ t_ab != -1 }}"
                          then:
                            - delay:
                                seconds: "{{ [t_ab, 0] | max }}"
                            # Post-delay: apagar solo si la puerta sigue abierta
                            - if:
                                - "{{ states(p) == 'on' }}"
                              then:
                                - service: homeassistant.turn_off
                                  target:
                                    entity_id: "{{ d }}"
                                - service: system_log.write
                                  data:
                                    level: info
                                    logger: "blueprint.door_light"
                                    message: >
                                      [{{ auto_name }}] Pareja {{ par }} — t_ab agotado
                                      ({{ t_ab }}s), puerta aún abierta → '{{ d }}' apagado.
                              else:
                                - service: system_log.write
                                  data:
                                    level: info
                                    logger: "blueprint.door_light"
                                    message: >
                                      [{{ auto_name }}] Pareja {{ par }} — t_ab vencido
                                      pero puerta ya cerrada → control transferido a t_ce.

            # ════════════════════════════════════════════════════════════════
            #  CASO B — PUERTA CIERRA → timer t_ce → apagar
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'off' }}"
              sequence:
                - service: system_log.write
                  data:
                    level: info
                    logger: "blueprint.door_light"
                    message: >
                      [{{ auto_name }}] Pareja {{ par }} — Puerta CERRADA.
                      t_ce: {{ 'ilimitado (sin apagado)' if t_ce == -1 else t_ce | string ~ 's' }}.

                # Timer t_ce: -1 = no apaga | 0 = apaga inmediato | >0 = espera
                - if:
                    - "{{ t_ce != -1 }}"
                  then:
                    - delay:
                        seconds: "{{ [t_ce, 0] | max }}"
                    # Post-delay: apagar solo si la puerta sigue cerrada
                    # Si volvió a abrirse, el CASO A ya está manejando la situación
                    - if:
                        - "{{ states(p) == 'off' }}"
                      then:
                        - service: homeassistant.turn_off
                          target:
                            entity_id: "{{ d }}"
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — t_ce agotado
                              ({{ t_ce }}s) → '{{ d }}' apagado.
                      else:
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — t_ce cancelado:
                              puerta volvió a abrirse → control transferido a CASO A.

            # ════════════════════════════════════════════════════════════════
            #  CASO C — DISPOSITIVO ENCENDIDO MANUALMENTE → timer según puerta
            #
            #  Nota: este caso solo se activa cuando el trigger viene del
            #  dispositivo (eid == d), no del sensor de puerta.
            #  Esto permite detectar encendidos manuales independientemente
            #  de los encendidos automáticos del CASO A.
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == d and new_state == 'on' }}"
              sequence:
                - variables:
                    # Estado actual de la puerta en el momento del encendido manual
                    puerta_estado: "{{ states(p) }}"
                    # Seleccionar timer según estado de la puerta
                    timer_aplicado: >
                      {{ t_ab if puerta_estado == 'on' else t_mc }}
                    tipo_timer: >
                      {{ 'puerta abierta (t_ab)' if puerta_estado == 'on'
                         else 'puerta cerrada (t_mc)' }}

                - service: system_log.write
                  data:
                    level: info
                    logger: "blueprint.door_light"
                    message: >
                      [{{ auto_name }}] Pareja {{ par }} — Encendido MANUAL
                      de '{{ d }}'. Puerta: {{ puerta_estado }}.
                      Timer aplicado ({{ tipo_timer }}):
                      {{ 'ilimitado' if timer_aplicado == -1 else timer_aplicado | string ~ 's' }}.

                # Aplicar timer solo si != -1
                - if:
                    - "{{ timer_aplicado != -1 }}"
                  then:
                    - delay:
                        seconds: "{{ [timer_aplicado, 0] | max }}"
                    # Post-delay: apagar. El dispositivo puede haberse apagado
                    # manualmente durante el delay — solo apagamos si sigue encendido
                    - if:
                        - "{{ states(d) == 'on' }}"
                      then:
                        - service: homeassistant.turn_off
                          target:
                            entity_id: "{{ d }}"
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Timer manual
                              agotado ({{ timer_aplicado }}s) → '{{ d }}' apagado.
                      else:
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.door_light"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Timer manual
                              vencido pero '{{ d }}' ya estaba apagado. Sin acción.

# ────────────────────────────────────────────────────────────────────────────
#  MODO DE EJECUCIÓN
#
#  restart     : cancela cualquier delay activo al llegar un nuevo evento.
#                Garantiza que los timers siempre correspondan al estado
#                actual — nunca quedan timers huérfanos en paralelo.
#
#  max_exceeded silent : descarta silenciosamente si hay sobrecarga,
#                        sin generar errores adicionales en el log.
# ────────────────────────────────────────────────────────────────────────────
mode: restart
max_exceeded: silent
