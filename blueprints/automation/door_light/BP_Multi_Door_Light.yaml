blueprint:
  name: "Puerta → Luz / Interruptor con temporización (hasta 10 parejas)"
  description: >
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**


    ## ¿Para qué sirve?


    Vincula sensores de puerta con luces o interruptores de forma **lógica**,
    sin cableado físico. Al abrir la puerta enciende la luz; al cerrarla la
    mantiene encendida un tiempo adicional. Si el usuario enciende el switch
    manualmente, se aplica el timer correspondiente según el estado de la puerta.


    ## Lógica de funcionamiento


    - 🔓 **Puerta ABRE** → enciende la luz. Timer `t_ab` activo si ≠ -1.

    - 🔒 **Puerta CIERRA** → timer `t_ce`. Si -1, queda encendida indefinidamente.

    - 💡 **Switch ON manual + puerta ABIERTA** → reinicia el timer `t_ab`
      exactamente como si la puerta se acabara de abrir.

    - 💡 **Switch ON manual + puerta CERRADA** → aplica timer `t_mc`
      (tiempo específico para encendido manual con puerta cerrada).

    - ⏱ **-1 en cualquier tiempo** → encendido **indefinido**, sin apagado automático.

    - 🔄 Si la puerta cambia de estado mientras hay un timer activo,
      el timer se reinicia con el nuevo estado (mode restart).


    Versión 1.1.0 · www.evotechltda.com · admin@evotechltda.com

  domain: automation
  homeassistant:
    min_version: "2024.4.0"
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/door_light/BP_Multi_Door_Light.yaml"

