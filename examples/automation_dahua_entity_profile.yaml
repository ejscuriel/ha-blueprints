- id: mantenimiento_dahua_perfil_minimo_manual
  alias: DAHUA - Aplicar perfil mínimo de entidades
  description: >-
    Automatización de ejecución exclusivamente manual. Después de agregar una
    cámara Dahua, usa Ejecutar acciones para conservar solo las seis entidades
    aprobadas y recibir un resumen final.
  triggers: []
  conditions: []
  actions:
    - action: dahua_entity_profile.apply
      data:
        platform: dahua
        keep_names:
          - Main
          - Sub
          - Motion Alarm
          - Smart Motion Human
          - Motion Detection
          - Smart Motion Detection
        reload_integrations: true
        notify: true
  mode: single
  max_exceeded: warning
