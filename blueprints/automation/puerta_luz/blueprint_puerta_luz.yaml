blueprint:
  name: "Puerta → Luz / Interruptor con temporización (hasta 10 parejas)"
  description: >
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**


    ## ¿Para qué sirve?


    En instalaciones domóticas modernas es común tener sensores de puerta o ventana
    que deben controlar luces o interruptores **sin cableado físico directo**.
    Este blueprint establece un vínculo **lógico** entre el sensor y la luz:
    al abrir la puerta la luz se enciende automáticamente, y al cerrarla
    se apaga tras un tiempo configurable — exactamente como un interruptor
    automático de escalera o pasillo, pero totalmente personalizable.


    Ideal para **entradas, pasillos, closets, bodegas, baños y garajes**
    donde la luz debe responder al movimiento de la puerta. Con una sola
    instancia gestionas hasta **10 parejas** puerta↔luz, cada una con sus
    propios tiempos de apagado.


    ## Lógica de funcionamiento


    - 🔓 **Puerta ABRE** → enciende la luz inmediatamente.
      Si `tiempo puerta abierta` ≠ -1, apaga automáticamente tras ese tiempo
      (útil para limitar el consumo si alguien olvida cerrar).

    - 🔒 **Puerta CIERRA** → mantiene la luz encendida el tiempo configurado
      para que nadie quede a oscuras. Si `tiempo tras cierre` = -1,
      la luz permanece encendida hasta que alguien la apague manualmente.

    - 💡 **Switch ON manual + puerta ABIERTA** → aplica el tiempo de puerta abierta.

    - 💡 **Switch ON manual + puerta CERRADA** → aplica el tiempo tras cierre.

    - ⏱ **-1 en cualquier tiempo** → encendido **indefinido**, sin temporizador.

    - 🔄 Si la puerta vuelve a cambiar mientras hay un timer activo,
      el timer se reinicia automáticamente con el nuevo estado (mode restart).


    ## Compatible con

    - Sensores de puerta/ventana **WiFi** y **Zigbee** (Aqara, Sonoff, IKEA, etc.)

    - Luces y switches integrados en HA (Tuya, Sonoff, ESPHome, Zigbee2MQTT, ZHA, etc.)


    Versión 1.0.0 · www.evotechltda.com · admin@evotechltda.com

  domain: automation

  # Versión mínima de HA requerida (secciones plegables desde 2024.4)
  homeassistant:
    min_version: "2024.4.0"

  # Campos reconocidos por el directorio oficial de HA
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/puerta_luz/blueprint_puerta_luz.yaml"

  # ────────────────────────────────────────────────────────────────────────────
  #  PARÁMETROS DE ENTRADA
  #  Pareja 1 visible por defecto. Parejas 2–10 colapsadas.
  #  Expande solo las que necesites; las vacías se ignoran automáticamente.
  # ────────────────────────────────────────────────────────────────────────────
  input:

    # ── Valores globales por defecto ──────────────────────────────────────────
    # Se aplican a cualquier pareja que no defina sus propios tiempos (valor 0).
    seccion_defaults:
      name: "⚙ Valores por defecto"
      collapsed: false
      input:

        tiempo_abierta_default:
          name: "⏱ Tiempo máximo con puerta abierta (segundos)"
          description: >
            Segundos que la luz permanece encendida mientras la puerta está abierta.
            Al vencer el tiempo se apaga automáticamente — útil para evitar
            que la luz quede encendida si alguien olvida cerrar la puerta.
            Usa -1 para encendido indefinido sin límite de tiempo.
          default: 300
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box

        tiempo_cerrada_default:
          name: "⏱ Tiempo encendida tras cerrar la puerta (segundos)"
          description: >
            Segundos que la luz permanece encendida después de cerrar la puerta,
            para que nadie quede a oscuras al salir.
            Usa -1 para que la luz quede encendida indefinidamente hasta
            que alguien la apague de forma manual.
          default: 60
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box

    # ── Pareja 1 (obligatoria) ────────────────────────────────────────────────
    pareja_1:
      name: "🚪 Pareja 1"
      collapsed: false
      input:
        puerta_1:
          name: Sensor de puerta / ventana
          description: >
            Binary sensor de contacto. Estado ON = abierta, OFF = cerrada.
            Compatible con sensores de puerta, ventana y apertura general.
          selector:
            entity:
              domain: binary_sensor
              device_class:
                - door
                - window
                - opening
        luz_1:
          name: Luz o interruptor a controlar
          description: "Acepta tanto light.* como switch.*"
          selector:
            target:
        tiempo_abierta_1:
          name: "Tiempo puerta abierta en s (0 = usar defecto | -1 = ilimitado)"
          default: 0
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box
        tiempo_cerrada_1:
          name: "Tiempo tras cerrar en s (0 = usar defecto | -1 = ilimitado)"
          default: 0
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box

    # ── Parejas 2–10 (opcionales, colapsadas) ────────────────────────────────
