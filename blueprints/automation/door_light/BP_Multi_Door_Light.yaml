# ║         BLUEPRINT: Puerta → Luz / Interruptor con Temporización            ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  Descripción : Vincula hasta 10 parejas sensor de puerta ↔ luz/switch.     ║
# ║                                                                             ║
# ║  Lógica de tiempos:                                                         ║
# ║    · Puerta ABRE             → enciende luz, timer t_ab                    ║
# ║    · Puerta CIERRA           → timer t_ce y apaga                          ║
# ║    · Switch ON + puerta ABIERTA  → reinicia timer t_ab (como si abriera)   ║
# ║    · Switch ON + puerta CERRADA  → timer t_mc (nuevo parámetro)            ║
# ║    · -1 en cualquier tiempo  → encendido indefinido                        ║
