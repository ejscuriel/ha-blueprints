        tiempo_abierta_default:
          name: "⏱ Tiempo máximo con puerta abierta (segundos)"
          description: >
            Segundos encendida mientras la puerta está abierta.
            -1 = sin límite de tiempo.
          default: 300
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box

        tiempo_cerrada_default:
          name: "⏱ Tiempo encendida tras cerrar la puerta (segundos)"
          description: >
            Segundos encendida después de cerrar la puerta.
            -1 = queda encendida indefinidamente.
          default: 60
          selector:
            number:
