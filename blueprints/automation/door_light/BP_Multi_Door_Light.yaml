    # ── Pareja 1 (obligatoria) ────────────────────────────────────────────────
    pareja_1:
      name: "🚪 Pareja 1"
      collapsed: false
      input:
        puerta_1:
          name: Sensor de puerta / ventana
          description: "Binary sensor: ON = abierta, OFF = cerrada."
          selector:
            entity:
              domain: binary_sensor
              device_class: [door, window, opening]
        dispositivo_1:
          name: Luz o interruptor
          description: "Acepta light.* y switch.*"
          selector:
            entity:
              domain: [light, switch]
        tiempo_abierto_1:
          name: "⏱ t_ab — Encendido manual + puerta abierta (s)"
          description: "Segundos antes de apagar. 0 = inmediato | -1 = ilimitado"
          default: 300
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box
        tiempo_cerrado_1:
          name: "⏱ t_ce — Tras cerrar la puerta (s)"
          description: "Segundos antes de apagar. 0 = inmediato | -1 = ilimitado"
          default: 60
          selector:
            number:
              min: -1
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: box
        tiempo_manual_1:
