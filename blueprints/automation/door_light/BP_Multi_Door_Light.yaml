blueprint:
  name: "Door → Light / Switch with timers (up to 10 pairs)"
  description: >
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**


    ## ¿Para qué sirve?


    Vincula hasta 10 parejas sensor de puerta ↔ luz/switch de forma **lógica**,
    sin cableado físico. Compatible con sensores **WiFi y Zigbee** y con
    dispositivos integrados en HA (Tuya, Sonoff, ESPHome, Zigbee2MQTT, ZHA).


    ## Lógica de control


    - 🔓 **Puerta ABRE** → enciende el dispositivo. Aplica timer `t_ab`.
      Si `t_ab` = -1, queda encendido indefinidamente hasta que cierre.

    - 🔒 **Puerta CIERRA** → espera `t_ce` segundos y apaga.
      Si `t_ce` = -1, queda encendido indefinidamente.

    - 💡 **Encendido manual + puerta ABIERTA** → reinicia timer `t_ab`.

    - 💡 **Encendido manual + puerta CERRADA** → aplica timer `t_mc`.

    - **`0`** en cualquier tiempo = apaga inmediatamente.

    - **`-1`** en cualquier tiempo = sin apagado automático (ilimitado).

    - 🔄 Si la puerta cambia estado mientras hay un timer activo,
      el timer se cancela y se reinicia con el nuevo estado (mode restart).


    Versión 2.0.0 · www.evotechltda.com · admin@evotechltda.com

  domain: automation
  homeassistant:
    min_version: "2024.4.0"
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/door_light/BP_Multi_Door_Light.yaml"

  # ────────────────────────────────────────────────────────────────────────────
