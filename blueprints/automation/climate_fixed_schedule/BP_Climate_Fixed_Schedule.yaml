trigger_variables:
  _entidad_clima_disparador: !input entidad_clima

variables:
  entidad_clima: !input entidad_clima
  modo_hvac_forzado: !input modo_hvac_forzado
  ejecutar_acciones_adicionales_en: !input ejecutar_acciones_adicionales_en

  forzar_reenvio_inicial: !input forzar_reenvio_inicial
  temperatura_inicial: !input temperatura_inicial
  ventilador_inicial: !input ventilador_inicial
  oscilacion_vertical_inicial: !input oscilacion_vertical_inicial
  oscilacion_horizontal_inicial: !input oscilacion_horizontal_inicial

  habilitar_horario_1: !input habilitar_horario_1
  forzar_reenvio_horario_1: !input forzar_reenvio_horario_1
  temperatura_horario_1: !input temperatura_horario_1
  ventilador_horario_1: !input ventilador_horario_1
  oscilacion_vertical_horario_1: !input oscilacion_vertical_horario_1
  oscilacion_horizontal_horario_1: !input oscilacion_horizontal_horario_1

  habilitar_horario_2: !input habilitar_horario_2
  forzar_reenvio_horario_2: !input forzar_reenvio_horario_2
  temperatura_horario_2: !input temperatura_horario_2
  ventilador_horario_2: !input ventilador_horario_2
  oscilacion_vertical_horario_2: !input oscilacion_vertical_horario_2
  oscilacion_horizontal_horario_2: !input oscilacion_horizontal_horario_2

  habilitar_horario_3: !input habilitar_horario_3
  forzar_reenvio_horario_3: !input forzar_reenvio_horario_3
  temperatura_horario_3: !input temperatura_horario_3
  ventilador_horario_3: !input ventilador_horario_3
  oscilacion_vertical_horario_3: !input oscilacion_vertical_horario_3
  oscilacion_horizontal_horario_3: !input oscilacion_horizontal_horario_3

  habilitar_horario_4: !input habilitar_horario_4
  forzar_reenvio_horario_4: !input forzar_reenvio_horario_4
  temperatura_horario_4: !input temperatura_horario_4
  ventilador_horario_4: !input ventilador_horario_4
  oscilacion_vertical_horario_4: !input oscilacion_vertical_horario_4
  oscilacion_horizontal_horario_4: !input oscilacion_horizontal_horario_4

  habilitar_horario_5: !input habilitar_horario_5
  forzar_reenvio_horario_5: !input forzar_reenvio_horario_5
  temperatura_horario_5: !input temperatura_horario_5
  ventilador_horario_5: !input ventilador_horario_5
  oscilacion_vertical_horario_5: !input oscilacion_vertical_horario_5
  oscilacion_horizontal_horario_5: !input oscilacion_horizontal_horario_5

triggers:
  # El temporizador pertenece al disparador, no a la ejecución. Por eso el modo
  # single permanece libre durante el minuto de estabilización del equipo.
  - trigger: template
    alias: Unidad encendida de forma continua durante un minuto
    value_template: >
      {{
        states(_entidad_clima_disparador)
        not in ['off', 'unknown', 'unavailable']
      }}
    for: "00:01:00"
    id: aire_encendido

  - trigger: time
    alias: Hora del perfil 1
    at: !input hora_horario_1
    enabled: !input habilitar_horario_1
    id: horario_1

  - trigger: time
    alias: Hora del perfil 2
    at: !input hora_horario_2
    enabled: !input habilitar_horario_2
    id: horario_2

  - trigger: time
    alias: Hora del perfil 3
    at: !input hora_horario_3
    enabled: !input habilitar_horario_3
    id: horario_3

  - trigger: time
    alias: Hora del perfil 4
    at: !input hora_horario_4
    enabled: !input habilitar_horario_4
    id: horario_4

  - trigger: time
    alias: Hora del perfil 5
    at: !input hora_horario_5
    enabled: !input habilitar_horario_5
    id: horario_5

# Solo se inicia una ejecución al cumplirse el minuto de encendido o cuando llega
# una hora habilitada. La disponibilidad y el estado encendido se validan antes
# de enviar cualquier orden.
conditions:
  - condition: template
    alias: Validar que el evento requiere una acción
    value_template: >
      {% if trigger.id == 'aire_encendido' %}
        true
      {% elif trigger.id == 'horario_1' %}
        {{ habilitar_horario_1 | bool }}
      {% elif trigger.id == 'horario_2' %}
        {{ habilitar_horario_2 | bool }}
      {% elif trigger.id == 'horario_3' %}
        {{ habilitar_horario_3 | bool }}
      {% elif trigger.id == 'horario_4' %}
        {{ habilitar_horario_4 | bool }}
      {% elif trigger.id == 'horario_5' %}
        {{ habilitar_horario_5 | bool }}
      {% else %}
        false
      {% endif %}

actions:
  - alias: Validar disponibilidad y estado antes de controlar la unidad
    choose:
      - conditions:
          - condition: template
            value_template: >
              {{ states(entidad_clima) in ['unknown', 'unavailable'] }}
        sequence:
          - action: system_log.write
            alias: Registrar unidad no disponible
            data:
              level: warning
              logger: blueprints.evotech.climate_fixed_schedule
              message: >
                Perfil {{ trigger.id }} omitido: {{ entidad_clima }} está
                {{ states(entidad_clima) }}. No se envió ninguna orden de control.
          - stop: Unidad de aire no disponible; perfil omitido

      - conditions:
          - condition: state
            entity_id: !input entidad_clima
            state: "off"
        sequence:
          - stop: Unidad apagada; el perfil horario no corresponde

  - alias: Identificar el evento y cargar el perfil correspondiente
    variables:
      forzar_reenvio_perfil: >
        {% if trigger.id == 'horario_1' %}
          {{ forzar_reenvio_horario_1 }}
        {% elif trigger.id == 'horario_2' %}
          {{ forzar_reenvio_horario_2 }}
        {% elif trigger.id == 'horario_3' %}
          {{ forzar_reenvio_horario_3 }}
        {% elif trigger.id == 'horario_4' %}
          {{ forzar_reenvio_horario_4 }}
        {% elif trigger.id == 'horario_5' %}
          {{ forzar_reenvio_horario_5 }}
        {% else %}
          {{ forzar_reenvio_inicial }}
        {% endif %}
      temperatura_perfil: >
        {% if trigger.id == 'horario_1' %}
          {{ temperatura_horario_1 }}
        {% elif trigger.id == 'horario_2' %}
          {{ temperatura_horario_2 }}
        {% elif trigger.id == 'horario_3' %}
          {{ temperatura_horario_3 }}
        {% elif trigger.id == 'horario_4' %}
          {{ temperatura_horario_4 }}
        {% elif trigger.id == 'horario_5' %}
          {{ temperatura_horario_5 }}
        {% else %}
          {{ temperatura_inicial }}
        {% endif %}
      ventilador_perfil: >
        {% if trigger.id == 'horario_1' %}
          {{ ventilador_horario_1 }}
        {% elif trigger.id == 'horario_2' %}
          {{ ventilador_horario_2 }}
        {% elif trigger.id == 'horario_3' %}
          {{ ventilador_horario_3 }}
        {% elif trigger.id == 'horario_4' %}
          {{ ventilador_horario_4 }}
        {% elif trigger.id == 'horario_5' %}
          {{ ventilador_horario_5 }}
        {% else %}
          {{ ventilador_inicial }}
        {% endif %}
      oscilacion_vertical_perfil: >
        {% if trigger.id == 'horario_1' %}
          {{ oscilacion_vertical_horario_1 }}
        {% elif trigger.id == 'horario_2' %}
          {{ oscilacion_vertical_horario_2 }}
        {% elif trigger.id == 'horario_3' %}
          {{ oscilacion_vertical_horario_3 }}
        {% elif trigger.id == 'horario_4' %}
          {{ oscilacion_vertical_horario_4 }}
        {% elif trigger.id == 'horario_5' %}
          {{ oscilacion_vertical_horario_5 }}
        {% else %}
          {{ oscilacion_vertical_inicial }}
        {% endif %}
      oscilacion_horizontal_perfil: >
        {% if trigger.id == 'horario_1' %}
          {{ oscilacion_horizontal_horario_1 }}
        {% elif trigger.id == 'horario_2' %}
          {{ oscilacion_horizontal_horario_2 }}
        {% elif trigger.id == 'horario_3' %}
          {{ oscilacion_horizontal_horario_3 }}
        {% elif trigger.id == 'horario_4' %}
          {{ oscilacion_horizontal_horario_4 }}
        {% elif trigger.id == 'horario_5' %}
          {{ oscilacion_horizontal_horario_5 }}
        {% else %}
          {{ oscilacion_horizontal_inicial }}
        {% endif %}

  - alias: Aplicar el perfil sin ejecuciones simultáneas
    sequence:
      - alias: Validar y aplicar el modo HVAC obligatorio
        choose:
          - conditions:
              - condition: template
                value_template: >
                  {{
                    states(entidad_clima)
                      not in ['off', 'unknown', 'unavailable']
                    and modo_hvac_forzado in
                      (state_attr(entidad_clima, 'hvac_modes') or [])
                  }}
            sequence:
              - alias: Cambiar el modo solamente si es necesario
                if:
                  - condition: template
                    value_template: >
                      {{
                        forzar_reenvio_perfil | bool
                        or states(entidad_clima) != modo_hvac_forzado
                      }}
                then:
                  - action: climate.set_hvac_mode
                    alias: Aplicar modo HVAC obligatorio
                    continue_on_error: true
                    target:
                      entity_id: "{{ entidad_clima }}"
                    data:
                      hvac_mode: "{{ modo_hvac_forzado }}"
                  - delay: !input pausa_entre_ordenes
      - alias: Aplicar la temperatura si cambió
        if:
          - condition: template
            value_template: >
              {{
                states(entidad_clima)
                  not in ['off', 'unknown', 'unavailable']
                and (
                  forzar_reenvio_perfil | bool
                  or (state_attr(entidad_clima, 'temperature') | float(-999))
                    != (temperatura_perfil | float)
                )
              }}
        then:
          - action: climate.set_temperature
            alias: Aplicar temperatura del perfil
            continue_on_error: true
            target:
              entity_id: "{{ entidad_clima }}"
            data:
              temperature: "{{ temperatura_perfil | float }}"
          - delay: !input pausa_entre_ordenes

      - alias: Aplicar el ventilador seleccionado
        choose:
          - conditions:
              - condition: template
                value_template: >
                  {{
                    states(entidad_clima)
                      not in ['off', 'unknown', 'unavailable']
                    and ventilador_perfil != '__no_change__'
                    and ventilador_perfil in
                      (state_attr(entidad_clima, 'fan_modes') or [])
                  }}
            sequence:
              - alias: Cambiar el ventilador solamente si es necesario
                if:
                  - condition: template
                    value_template: >
                      {{
                        forzar_reenvio_perfil | bool
                        or state_attr(entidad_clima, 'fan_mode')
                          != ventilador_perfil
                      }}
                then:
                  - action: climate.set_fan_mode
                    alias: Aplicar ventilador del perfil
                    continue_on_error: true
                    target:
                      entity_id: "{{ entidad_clima }}"
                    data:
                      fan_mode: "{{ ventilador_perfil }}"
                  - delay: !input pausa_entre_ordenes

      - alias: Aplicar la oscilación vertical seleccionada
        choose:
          - conditions:
              - condition: template
                value_template: >
                  {{
                    states(entidad_clima)
                      not in ['off', 'unknown', 'unavailable']
                    and oscilacion_vertical_perfil != '__no_change__'
                    and oscilacion_vertical_perfil in
                      (state_attr(entidad_clima, 'swing_modes') or [])
                  }}
            sequence:
              - alias: Cambiar la oscilación vertical solamente si es necesario
                if:
                  - condition: template
                    value_template: >
                      {{
                        forzar_reenvio_perfil | bool
                        or state_attr(entidad_clima, 'swing_mode')
                          != oscilacion_vertical_perfil
                      }}
                then:
                  - action: climate.set_swing_mode
                    alias: Aplicar oscilación vertical del perfil
                    continue_on_error: true
                    target:
                      entity_id: "{{ entidad_clima }}"
                    data:
                      swing_mode: "{{ oscilacion_vertical_perfil }}"
                  - delay: !input pausa_entre_ordenes

      - alias: Aplicar la oscilación horizontal seleccionada
        choose:
          - conditions:
              - condition: template
                value_template: >
                  {{
                    states(entidad_clima)
                      not in ['off', 'unknown', 'unavailable']
                    and oscilacion_horizontal_perfil != '__no_change__'
                    and oscilacion_horizontal_perfil in
                      (state_attr(entidad_clima, 'swing_horizontal_modes') or [])
                  }}
            sequence:
              - alias: Cambiar la oscilación horizontal solamente si es necesario
                if:
                  - condition: template
                    value_template: >
                      {{
                        forzar_reenvio_perfil | bool
                        or state_attr(entidad_clima, 'swing_horizontal_mode')
                          != oscilacion_horizontal_perfil
                      }}
                then:
                  - action: climate.set_swing_horizontal_mode
                    alias: Aplicar oscilación horizontal del perfil
                    continue_on_error: true
                    target:
                      entity_id: "{{ entidad_clima }}"
                    data:
                      swing_horizontal_mode: "{{ oscilacion_horizontal_perfil }}"
                  - delay: !input pausa_entre_ordenes

      - alias: Ejecutar las acciones adicionales configuradas
        if:
          - condition: template
            value_template: >
              {{
                states(entidad_clima)
                not in ['off', 'unknown', 'unavailable']
                and trigger.id in ejecutar_acciones_adicionales_en
              }}
        then:
          - alias: Ejecutar acciones adicionales sin cancelar la verificación
            continue_on_error: true
            sequence: !input acciones_adicionales

      - alias: Esperar la confirmación de estado del equipo
        delay: "00:00:05"

      - alias: Comprobar el resultado completo del perfil
        variables:
          problemas_perfil: >
            {% set ns = namespace(items=[]) %}
            {% set estado = states(entidad_clima) %}
            {% set hvac_disponibles =
              state_attr(entidad_clima, 'hvac_modes') or [] %}
            {% set fan_disponibles =
              state_attr(entidad_clima, 'fan_modes') or [] %}
            {% set verticales_disponibles =
              state_attr(entidad_clima, 'swing_modes') or [] %}
            {% set horizontales_disponibles =
              state_attr(entidad_clima, 'swing_horizontal_modes') or [] %}

            {% if estado in ['unknown', 'unavailable'] %}
              {% set ns.items = ns.items +
                ['unidad ' ~ estado ~ ' al verificar'] %}
            {% elif estado == 'off' %}
              {% set ns.items = ns.items +
                ['unidad apagada antes de la verificación'] %}
            {% else %}
              {% if modo_hvac_forzado not in hvac_disponibles %}
                {% set ns.items = ns.items +
                  ['modo HVAC no soportado: ' ~ modo_hvac_forzado] %}
              {% elif estado != modo_hvac_forzado %}
                {% set ns.items = ns.items +
                  ['modo esperado ' ~ modo_hvac_forzado ~ ', recibido ' ~ estado] %}
              {% endif %}

              {% set temperatura_actual =
                state_attr(entidad_clima, 'temperature') %}
              {% if temperatura_actual is none %}
                {% set ns.items = ns.items +
                  ['temperatura sin confirmación'] %}
              {% elif ((temperatura_actual | float) -
                        (temperatura_perfil | float)) | abs > 0.1 %}
                {% set ns.items = ns.items +
                  ['temperatura esperada ' ~ (temperatura_perfil | string) ~
                   ', recibida ' ~ (temperatura_actual | string)] %}
              {% endif %}

              {% if ventilador_perfil != '__no_change__' %}
                {% if ventilador_perfil not in fan_disponibles %}
                  {% set ns.items = ns.items +
                    ['ventilador no soportado: ' ~ ventilador_perfil] %}
                {% elif state_attr(entidad_clima, 'fan_mode')
                          != ventilador_perfil %}
                  {% set ns.items = ns.items +
                    ['ventilador esperado ' ~ ventilador_perfil ~
                     ', recibido ' ~
                     (state_attr(entidad_clima, 'fan_mode') | string)] %}
                {% endif %}
              {% endif %}

              {% if oscilacion_vertical_perfil != '__no_change__' %}
                {% if oscilacion_vertical_perfil
                      not in verticales_disponibles %}
                  {% set ns.items = ns.items +
                    ['oscilación vertical no soportada: ' ~
                     oscilacion_vertical_perfil] %}
                {% elif state_attr(entidad_clima, 'swing_mode')
                          != oscilacion_vertical_perfil %}
                  {% set ns.items = ns.items +
                    ['vertical esperada ' ~ oscilacion_vertical_perfil ~
                     ', recibida ' ~
                     (state_attr(entidad_clima, 'swing_mode') | string)] %}
                {% endif %}
              {% endif %}

              {% if oscilacion_horizontal_perfil != '__no_change__' %}
                {% if oscilacion_horizontal_perfil
                      not in horizontales_disponibles %}
                  {% set ns.items = ns.items +
                    ['oscilación horizontal no soportada: ' ~
                     oscilacion_horizontal_perfil] %}
                {% elif state_attr(entidad_clima, 'swing_horizontal_mode')
                          != oscilacion_horizontal_perfil %}
                  {% set ns.items = ns.items +
                    ['horizontal esperada ' ~ oscilacion_horizontal_perfil ~
                     ', recibida ' ~
                     (state_attr(entidad_clima,
                                 'swing_horizontal_mode') | string)] %}
                {% endif %}
              {% endif %}
            {% endif %}
            {{ ns.items | join(' | ') }}

      - alias: Registrar únicamente si el perfil terminó con problemas
        if:
          - condition: template
            value_template: "{{ problemas_perfil | trim | length > 0 }}"
        then:
          - action: system_log.write
            alias: Escribir resumen final de problemas
            data:
              level: error
              logger: blueprints.evotech.climate_fixed_schedule
              message: >
                Perfil {{ trigger.id }} con problemas en {{ entidad_clima }}:
                {{ problemas_perfil }}.

# Cada instancia controla una sola entidad climate. El modo single impide que
# dos perfiles de esa unidad se ejecuten al mismo tiempo. Otras instancias del
# blueprint, creadas para otros aires, funcionan de manera independiente.
mode: single
max_exceeded: warning
