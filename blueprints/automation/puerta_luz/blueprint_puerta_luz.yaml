# ────────────────────────────────────────────────────────────────────────────
#  VARIABLES GLOBALES
#
#  IMPORTANTE: !input es una directiva YAML que HA resuelve antes de procesar
#  los templates Jinja2. Por eso cada !input debe declararse como variable
#  simple aquí y usarse por nombre dentro de los templates.
#  Intentar usar !input dentro de {{ }} causaría TemplateSyntaxError.
# ────────────────────────────────────────────────────────────────────────────
variables:
  # Tiempos globales por defecto
  t_ab_def: !input tiempo_abierta_default
  t_ce_def: !input tiempo_cerrada_default

  # Datos de cada pareja (sensor, target, tiempos individuales)
  p1:  !input puerta_1
  l1:  !input luz_1
  a1:  !input tiempo_abierta_1
  c1:  !input tiempo_cerrada_1

  p2:  !input puerta_2
  l2:  !input luz_2
  a2:  !input tiempo_abierta_2
  c2:  !input tiempo_cerrada_2

  p3:  !input puerta_3
  l3:  !input luz_3
  a3:  !input tiempo_abierta_3
  c3:  !input tiempo_cerrada_3

  p4:  !input puerta_4
  l4:  !input luz_4
  a4:  !input tiempo_abierta_4
  c4:  !input tiempo_cerrada_4

  p5:  !input puerta_5
  l5:  !input luz_5
  a5:  !input tiempo_abierta_5
  c5:  !input tiempo_cerrada_5

  p6:  !input puerta_6
  l6:  !input luz_6
  a6:  !input tiempo_abierta_6
  c6:  !input tiempo_cerrada_6

  p7:  !input puerta_7
  l7:  !input luz_7
  a7:  !input tiempo_abierta_7
  c7:  !input tiempo_cerrada_7

  p8:  !input puerta_8
  l8:  !input luz_8
  a8:  !input tiempo_abierta_8
  c8:  !input tiempo_cerrada_8

  p9:  !input puerta_9
  l9:  !input luz_9
  a9:  !input tiempo_abierta_9
  c9:  !input tiempo_cerrada_9

  p10: !input puerta_10
  l10: !input luz_10
  a10: !input tiempo_abierta_10
  c10: !input tiempo_cerrada_10

  # Lista de parejas activas.
  # selectattr('p') filtra las entradas donde el sensor es null/vacío,
  # descartando automáticamente las parejas no configuradas.
  parejas: >
    {% set raw = [
      {'p': p1,  'l': l1,  'a': a1,  'c': c1 },
      {'p': p2,  'l': l2,  'a': a2,  'c': c2 },
      {'p': p3,  'l': l3,  'a': a3,  'c': c3 },
      {'p': p4,  'l': l4,  'a': a4,  'c': c4 },
      {'p': p5,  'l': l5,  'a': a5,  'c': c5 },
      {'p': p6,  'l': l6,  'a': a6,  'c': c6 },
      {'p': p7,  'l': l7,  'a': a7,  'c': c7 },
      {'p': p8,  'l': l8,  'a': a8,  'c': c8 },
      {'p': p9,  'l': l9,  'a': a9,  'c': c9 },
      {'p': p10, 'l': l10, 'a': a10, 'c': c10},
    ] %}
    {{ raw | selectattr('p') | list }}

# ────────────────────────────────────────────────────────────────────────────
#  TRIGGER
#
#  Se escucha el evento global state_changed. Usar event en lugar de
#  'platform: state' con entity_id permite que la lista de sensores sea
#  dinámica. El filtrado real ocurre en las condiciones.
# ────────────────────────────────────────────────────────────────────────────
trigger:
  - platform: event
    event_type: state_changed

# ────────────────────────────────────────────────────────────────────────────
#  CONDICIONES (todas deben cumplirse para continuar a la acción)
# ────────────────────────────────────────────────────────────────────────────
condition:

  # Condición 1 — Protección contra eventos de creación/eliminación de entidades
  # Cuando HA añade o elimina un dispositivo en tiempo real, old_state o
  # new_state pueden llegar como null, causando un crash. Esta guarda lo evita.
  - condition: template
    value_template: >
      {{ trigger.event.data.old_state is not none and
         trigger.event.data.new_state is not none }}

  # Condición 2 — La entidad que cambió es un sensor de alguna pareja activa.
  # Descarta el 99% de eventos de HA que no son relevantes para este blueprint.
  - condition: template
    value_template: >
      {% set eid     = trigger.event.data.entity_id %}
      {% set puertas = parejas | map(attribute='p') | list %}
      {{ eid in puertas }}

  # Condición 3 — El estado cambió y es válido (on/off).
  # Descarta: transiciones a unavailable/unknown, cambios de atributos
  # sin cambio de estado, y eventos duplicados.
  - condition: template
    value_template: >
      {% set ns = trigger.event.data.new_state.state %}
      {% set os = trigger.event.data.old_state.state %}
      {{ ns != os and ns in ['on', 'off'] }}

# ────────────────────────────────────────────────────────────────────────────
#  ACCIÓN
#
#  Recorre todas las parejas activas con for_each. Para cada pareja:
#
#  CASO A — Puerta ABRE (on):
#    1. Verifica disponibilidad del sensor (protección)
#    2. Enciende la luz/switch
#    3. Si t_ab != -1: espera t_ab segundos
#    4. Si la puerta SIGUE abierta al vencer el tiempo: apaga
#       (si ya se cerró, el CASO B tomará control al cerrarse)
#
#  CASO B — Puerta CIERRA (off):
#    1. Registra el evento en el log
#    2. Si t_ce != -1: espera t_ce segundos
#    3. Si la puerta SIGUE cerrada al vencer el tiempo: apaga
#       (si volvió a abrirse, el CASO A tomará control)
#
#  Resolución de tiempos:
#    t_ab / t_ce = 0  → usar valor global por defecto
#    t_ab / t_ce = -1 → sin temporizador (encendido indefinido)
#    cualquier otro   → usar ese valor en segundos
# ────────────────────────────────────────────────────────────────────────────
action:
  - variables:
      eid:       "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state.state }}"
      # Nombre de esta instancia de automatización para identificarla en el log.
      # Si la automatización tiene un nombre amigable se usa ese; si no, el entity_id.
      auto_name: "{{ this.attributes.friendly_name | default(this.entity_id) }}"

  - repeat:
      for_each: "{{ parejas }}"
      sequence:

        # Resolver parámetros de esta pareja antes de actuar.
        # Regla: 0 → defecto global | -1 → ilimitado | otro → valor propio
        - variables:
            p:    "{{ repeat.item.p }}"
            l:    "{{ repeat.item.l }}"
            t_ab: >
              {{ repeat.item.a | int
                 if repeat.item.a | int != 0
                 else t_ab_def | int }}
            t_ce: >
              {{ repeat.item.c | int
                 if repeat.item.c | int != 0
                 else t_ce_def | int }}
            par:  "{{ repeat.index }}"

        - choose:

            # ════════════════════════════════════════════════════════════════
            #  CASO A — PUERTA ABRE → encender luz
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'on' }}"
              sequence:

                # ── Protección: verificar disponibilidad del sensor ──────────
                # Si el sensor está unavailable/unknown no actuamos.
                # Esto evita el warning "Referenced entities are missing"
                # que genera HA en helpers/target.py al llamar un servicio
                # sobre una entidad no disponible.
                - if:
                    - "{{ states(p) in ['unavailable', 'unknown'] }}"
                  then:
                    - service: system_log.write
                      data:
                        level: warning
                        logger: "blueprint.puerta_luz"
                        message: >
                          [{{ auto_name }}] Pareja {{ par }} — OMITIDO Puerta→Luz:
                          Sensor '{{ p }}' no disponible (estado: '{{ states(p) }}').
                          Verifica la conexión del sensor de puerta.
                          Acción requerida: revisar batería o conectividad del sensor.

                  else:
                    # ── Encender la luz / switch ─────────────────────────────
                    # homeassistant.turn_on funciona tanto con light.* como switch.*
                    - service: homeassistant.turn_on
                      target: "{{ l }}"

                    - service: system_log.write
                      data:
                        level: info
                        logger: "blueprint.puerta_luz"
                        message: >
                          [{{ auto_name }}] Pareja {{ par }} — Puerta ABIERTA →
                          Luz encendida.
                          Tiempo máximo: {{ 'ilimitado' if t_ab == -1 else t_ab | string ~ 's' }}.

                    # ── Temporizador de puerta abierta (solo si t_ab != -1) ──
                    # Si t_ab es -1, la luz permanece encendida indefinidamente
                    # hasta que la puerta se cierre (CASO B) o acción manual.
                    - if:
                        - "{{ t_ab | int != -1 }}"
                      then:
                        - delay:
                            seconds: "{{ t_ab | int }}"

                        # Verificación post-delay: apagar solo si la puerta
                        # SIGUE abierta. Si ya se cerró, el CASO B ya actuó
                        # o actuará cuando llegue el evento de cierre.
                        - if:
                            - "{{ states(p) == 'on' }}"
                          then:
                            - service: homeassistant.turn_off
                              target: "{{ l }}"
                            - service: system_log.write
                              data:
                                level: info
                                logger: "blueprint.puerta_luz"
                                message: >
                                  [{{ auto_name }}] Pareja {{ par }} — Tiempo agotado
                                  ({{ t_ab }}s) con puerta aún abierta → Luz apagada.
                          else:
                            # La puerta ya se cerró antes de que venciera el timer.
                            # El CASO B tomará control. Solo registramos.
                            - service: system_log.write
                              data:
                                level: info
                                logger: "blueprint.puerta_luz"
                                message: >
                                  [{{ auto_name }}] Pareja {{ par }} — Timer de
                                  puerta abierta vencido pero puerta ya cerrada.
                                  Control transferido al timer de cierre.

            # ════════════════════════════════════════════════════════════════
            #  CASO B — PUERTA CIERRA → temporizador de apagado
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'off' }}"
              sequence:

                - service: system_log.write
                  data:
                    level: info
                    logger: "blueprint.puerta_luz"
                    message: >
                      [{{ auto_name }}] Pareja {{ par }} — Puerta CERRADA.
                      Apagado programado en:
                      {{ 'nunca — encendido indefinido' if t_ce == -1 else t_ce | string ~ 's' }}.

                # ── Temporizador de cierre (solo si t_ce != -1) ─────────────
                # Si t_ce es -1, la luz queda encendida indefinidamente.
                - if:
                    - "{{ t_ce | int != -1 }}"
                  then:
                    - delay:
                        seconds: "{{ t_ce | int }}"

                    # Verificación post-delay: apagar solo si la puerta
                    # SIGUE cerrada. Si volvió a abrirse, el CASO A ya actuó.
                    - if:
                        - "{{ states(p) == 'off' }}"
                      then:
                        - service: homeassistant.turn_off
                          target: "{{ l }}"
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.puerta_luz"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Tiempo tras
                              cierre agotado ({{ t_ce }}s) → Luz apagada.
                      else:
                        # La puerta volvió a abrirse antes de que venciera el timer.
                        # El CASO A tomará control con el nuevo evento de apertura.
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.puerta_luz"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Timer de cierre
                              cancelado: la puerta volvió a abrirse.
                              Control transferido al timer de apertura.

# ────────────────────────────────────────────────────────────────────────────
#  MODO DE EJECUCIÓN
#
#  restart     : si la puerta cambia de estado mientras hay un delay activo,
#                HA cancela el delay en curso y reinicia la automatización
#                con el nuevo evento. Esto garantiza que:
#                  - Un timer de "puerta abierta" se cancela si la puerta cierra
#                  - Un timer de "puerta cerrada" se cancela si la puerta abre
#                  - Nunca quedan timers huérfanos corriendo en segundo plano
#
#  max_exceeded silent : descarta silenciosamente si hay sobrecarga,
#                        sin generar errores adicionales en el log.
# ────────────────────────────────────────────────────────────────────────────
mode: restart
max_exceeded: silent
