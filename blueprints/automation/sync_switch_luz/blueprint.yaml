blueprint:
  name: "Vincular interruptores con luces (hasta 10 parejas)"
  description: >
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**


    Sincroniza hasta 10 parejas interruptor↔luz en una sola instancia.

    - Interruptor ON/OFF → enciende/apaga la luz con brillo y temperatura definidos.

    - Luz ON/OFF → enciende/apaga el interruptor.

    - Cada pareja puede tener su propio brillo y temperatura, o usar los valores por defecto.

    - Incluye protecciones ante entidades no disponibles y registro de eventos en el log de HA.


    Versión 1.1.0 · www.evotechltda.com · admin@evotechltda.com

  domain: automation

  # Versión mínima de HA requerida (secciones plegables desde 2024.4)
  homeassistant:
    min_version: "2024.4.0"

  # Campos reconocidos por el directorio oficial de HA
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/sync_switch_luz/blueprint_multi_switch_luz.yaml"

  # ────────────────────────────────────────────────────────────────────────────
  #  PARÁMETROS DE ENTRADA
  #  Pareja 1 visible por defecto. Parejas 2–10 colapsadas.
  #  Expande solo las que necesites; las vacías se ignoran automáticamente.
  # ────────────────────────────────────────────────────────────────────────────
  input:

    # ── Valores globales por defecto ─────────────────────────────────────────
    seccion_defaults:
      name: "⚙ Valores por defecto"
      collapsed: false
      input:
        brillo_default:
          name: Brillo por defecto (%)
          description: >
            Porcentaje de brillo al encender (1–100).
            Se usa cuando la pareja no define su propio brillo.
          default: 55
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        temperatura_default:
          name: Temperatura de color por defecto
          description: >
            En Kelvin: 2700 = cálido · 4000 = neutro · 6500 = frío.
            Se usa cuando la pareja no define su propia temperatura.
          default: 6500
          selector:
            number:
              min: 2700
              max: 6500
              step: 100
              unit_of_measurement: K
              mode: slider

    # ── Pareja 1 (obligatoria) ────────────────────────────────────────────────
    pareja_1:
      name: "💡 Pareja 1"
      collapsed: false
      input:
        interruptor_1:
          name: Interruptor
          description: "Switch Sonoff u otro interruptor WiFi integrado en HA."
          selector:
            entity:
              domain: switch
        luz_1:
          name: Luz
          description: "Controlador LED CCT u otra luz integrada en HA."
          selector:
            entity:
              domain: light
        brillo_1:
          name: Brillo % (0 = usar valor por defecto)
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        temperatura_1:
          name: Temperatura de color en K (0 = usar valor por defecto)
          default: 0
          selector:
            number:
              min: 0
              max: 6500
              step: 100
              unit_of_measurement: K
              mode: slider

    # ── Parejas 2–10 (opcionales, colapsadas) ────────────────────────────────
    # Expande la sección, asigna interruptor y luz, y guarda.
    # Si dejas los campos vacíos el blueprint los ignora automáticamente.

    pareja_2:
      name: "💡 Pareja 2  (opcional)"
      collapsed: true
      input:
