# ║  Descripción : Vincula hasta 10 parejas sensor de puerta ↔ luz/switch.     ║
# ║                                                                             ║
# ║  Lógica de control (basada en blueprint de referencia validado):            ║
# ║    · Puerta ABRE               → enciende dispositivo (sin timer)          ║
# ║    · Puerta CIERRA             → espera t_ce → apaga                       ║
# ║    · Dispositivo ON manual                                                  ║
# ║        + puerta ABIERTA        → espera t_ab → apaga                       ║
# ║        + puerta CERRADA        → espera t_mc → apaga                       ║
# ║    · -1 en cualquier tiempo    → sin apagado automático (ilimitado)        ║
# ║    · 0                         → apaga inmediatamente                      ║
