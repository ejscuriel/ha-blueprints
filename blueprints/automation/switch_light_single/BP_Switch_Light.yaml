# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  BLUEPRINT: Interruptor ↔ Luz — una pareja                                 ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  Sincroniza un interruptor y una luz en ambos sentidos.                    ║
# ║  Diseñado para crear una automatización independiente por pareja.          ║
# ║                                                                            ║
# ║  Autor       : Eduardo Sánchez Curiel — EVOTECH LTDA                       ║
# ║  Versión     : 2.1.0                                                       ║
# ║  Fecha       : 2026-10-10                                                  ║
# ║  Licencia    : MIT                                                         ║
# ║  Requisitos  : Home Assistant 2026.1.0 o superior                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

blueprint:
  name: Interruptor ↔ Luz — una pareja
  description: |
    **By EVOTECH LTDA · Eduardo Sánchez Curiel · Colombia**

    Sincroniza bidireccionalmente un interruptor y una luz sin cableado físico.
    Cada automatización administra una sola pareja, por lo que sus trazas,
    reinicios y errores quedan aislados de las demás habitaciones.

    - Interruptor `on` → enciende la luz con brillo y temperatura definidos.
    - Interruptor `off` → apaga la luz.
    - Luz `on` → enciende el interruptor.
    - Luz `off` → apaga el interruptor.
    - Estados `unknown` o `unavailable` no generan acciones cruzadas.

    Requiere **Home Assistant 2026.1.0 o posterior**.

    **Versión 2.1.0**

    **Acciones opcionales:** sección avanzada con check desactivado por defecto.
    Las automatizaciones existentes mantienen sus parámetros y lógica de control.

    www.evotechltda.com · admin@evotechltda.com

  domain: automation
  homeassistant:
    min_version: "2026.1.0"
  author: "Eduardo Sánchez Curiel — EVOTECH LTDA"
  source_url: "https://github.com/ejscuriel/ha-blueprints/blob/main/blueprints/automation/switch_light_single/BP_Switch_Light.yaml"

  input:
    pareja:
      name: "💡 Interruptor y luz"
      icon: mdi:light-switch
      collapsed: false
      input:
        interruptor:
          name: Interruptor
          description: Interruptor físico o lógico que se vinculará con la luz.
          selector:
            entity:
              filter:
                - domain: switch
              multiple: false

        luz:
          name: Luz
          description: Luz que se vinculará con el interruptor.
          selector:
            entity:
              filter:
                - domain: light
              multiple: false

    encendido:
      name: "🎚 Ajustes de encendido"
      icon: mdi:lightbulb-on-outline
      collapsed: false
      input:
        brillo:
          name: Brillo
          description: Brillo aplicado cuando el interruptor enciende la luz.
          default: 55
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        temperatura_color:
          name: Temperatura de color
          description: Temperatura aplicada al encender; 2700 K es cálido y 6500 K es frío.
          default: 6500
          selector:
            color_temp:
              unit: kelvin
              min: 2700
              max: 6500


    acciones_opcionales:
      name: "🧩 Acciones opcionales (avanzado)"
      icon: mdi:playlist-plus
      collapsed: true
      description: >
        Extensión voluntaria. Desactivada conserva el funcionamiento original.
        Configurar acciones o eventos no activa el check.
      input:
        habilitar_acciones_adicionales:
          name: Ejecutar acciones adicionales
          description: >
            Activa únicamente el bloque adicional. Puedes desmarcarlo sin borrar
            las acciones guardadas. Desactivado por defecto.
          default: false
          selector:
            boolean:

        acciones_adicionales:
          name: Acciones adicionales
          description: >
            Se ejecutan cuando ambos extremos quedan sincronizados en el estado elegido.
            Una sincronización produce un solo evento adicional.
            Para secuencias largas, llama a un script mediante script.turn_on.
          default: []
          selector:
            action:

        ejecutar_acciones_adicionales_en:
          name: Cuándo ejecutar las acciones adicionales
          description: >
            Puedes elegir encendido, apagado o ambos. Una selección vacía no
            ejecuta acciones. Este campo no activa el check general.
          default:
            - pareja_encendida
          selector:
            select:
              mode: list
              multiple: true
              options:
                - label: Al quedar interruptor y luz encendidos
                  value: pareja_encendida
                - label: Al quedar interruptor y luz apagados
                  value: pareja_apagada

variables:
  habilitar_acciones_adicionales: !input habilitar_acciones_adicionales
  ejecutar_acciones_adicionales_en: !input ejecutar_acciones_adicionales_en

# Cada disparador exige una transición real entre off y on. La recuperación
# desde unknown/unavailable no modifica la entidad asociada automáticamente.
# Estos inputs solo se usan para detectar que la sincronización ya terminó.
trigger_variables:
  _interruptor_acciones: !input interruptor
  _luz_acciones: !input luz

triggers:
  - trigger: state
    alias: Interruptor encendido
    entity_id: !input interruptor
    from: "off"
    to: "on"
    id: interruptor_encendido

  - trigger: state
    alias: Interruptor apagado
    entity_id: !input interruptor
    from: "on"
    to: "off"
    id: interruptor_apagado

  - trigger: state
    alias: Luz encendida
    entity_id: !input luz
    from: "off"
    to: "on"
    id: luz_encendida

  - trigger: state
    alias: Luz apagada
    entity_id: !input luz
    from: "on"
    to: "off"
    id: luz_apagada

  # Separar el evento de pareja sincronizada evita ejecutar dos veces el
  # bloque por el eco entre interruptor y luz. No envía órdenes de control.
  - trigger: template
    alias: Pareja sincronizada encendida para acciones opcionales
    value_template: >
      {{ is_state(_interruptor_acciones, 'on')
         and is_state(_luz_acciones, 'on') }}
    enabled: !input habilitar_acciones_adicionales
    id: pareja_encendida

  - trigger: template
    alias: Pareja sincronizada apagada para acciones opcionales
    value_template: >
      {{ is_state(_interruptor_acciones, 'off')
         and is_state(_luz_acciones, 'off') }}
    enabled: !input habilitar_acciones_adicionales
    id: pareja_apagada

conditions: []

actions:
  - alias: Sincronizar solamente cuando el otro extremo necesita cambiar
    choose:
      - conditions:
          - condition: trigger
            id: interruptor_encendido
          - condition: state
            entity_id: !input luz
            state: "off"
        sequence:
          - alias: Encender la luz con sus ajustes
            action: light.turn_on
            target:
              entity_id: !input luz
            data:
              brightness_pct: !input brillo
              color_temp_kelvin: !input temperatura_color

      - conditions:
          - condition: trigger
            id: interruptor_apagado
          - condition: state
            entity_id: !input luz
            state: "on"
        sequence:
          - alias: Apagar la luz
            action: light.turn_off
            target:
              entity_id: !input luz

      - conditions:
          - condition: trigger
            id: luz_encendida
          - condition: state
            entity_id: !input interruptor
            state: "off"
        sequence:
          - alias: Encender el interruptor
            action: switch.turn_on
            target:
              entity_id: !input interruptor

      - conditions:
          - condition: trigger
            id: luz_apagada
          - condition: state
            entity_id: !input interruptor
            state: "on"
        sequence:
          - alias: Apagar el interruptor
            action: switch.turn_off
            target:
              entity_id: !input interruptor


  # El control original ya finalizó. Solo los eventos de pareja sincronizada
  # ejecutan la extensión; los cuatro disparadores originales no la duplican.
  - alias: Ejecutar las acciones opcionales seleccionadas
    if:
      - condition: template
        value_template: >
          {{ habilitar_acciones_adicionales | bool
             and trigger is defined
             and trigger.id in ejecutar_acciones_adicionales_en
             and trigger.id in ['pareja_encendida', 'pareja_apagada'] }}
    then:
      - alias: Ejecutar el bloque adicional
        continue_on_error: true
        sequence: !input acciones_adicionales

# Una ejecución nueva sustituye a la anterior de esta pareja solamente.
mode: restart
max_exceeded: silent
