  m8:  !input tiempo_manual_8

  p9:  !input puerta_9
  l9:  !input luz_9
  a9:  !input tiempo_abierta_9
  c9:  !input tiempo_cerrada_9
  m9:  !input tiempo_manual_9

  p10: !input puerta_10
  l10: !input luz_10
  a10: !input tiempo_abierta_10
  c10: !input tiempo_cerrada_10
  m10: !input tiempo_manual_10

  # Lista de parejas activas. selectattr('p') descarta las no configuradas.
  parejas: >
    {% set raw = [
      {'p': p1,  'l': l1,  'a': a1,  'c': c1,  'm': m1 },
      {'p': p2,  'l': l2,  'a': a2,  'c': c2,  'm': m2 },
      {'p': p3,  'l': l3,  'a': a3,  'c': c3,  'm': m3 },
      {'p': p4,  'l': l4,  'a': a4,  'c': c4,  'm': m4 },
      {'p': p5,  'l': l5,  'a': a5,  'c': c5,  'm': m5 },
      {'p': p6,  'l': l6,  'a': a6,  'c': c6,  'm': m6 },
      {'p': p7,  'l': l7,  'a': a7,  'c': c7,  'm': m7 },
      {'p': p8,  'l': l8,  'a': a8,  'c': c8,  'm': m8 },
      {'p': p9,  'l': l9,  'a': a9,  'c': c9,  'm': m9 },
      {'p': p10, 'l': l10, 'a': a10, 'c': c10, 'm': m10},
    ] %}
    {{ raw | selectattr('p') | list }}

# ────────────────────────────────────────────────────────────────────────────
#  TRIGGER
#  Escucha el evento global state_changed.
#  Filtra en condiciones: sensores de puerta Y luz/switch de las parejas.
# ────────────────────────────────────────────────────────────────────────────
trigger:
  - platform: event
    event_type: state_changed

# ────────────────────────────────────────────────────────────────────────────
#  CONDICIONES
# ────────────────────────────────────────────────────────────────────────────
condition:

  # 1. Protección: old_state y new_state deben existir (entidad añadida/eliminada)
  - condition: template
    value_template: >
      {{ trigger.event.data.old_state is not none and
         trigger.event.data.new_state is not none }}

  # 2. La entidad pertenece a alguna pareja activa
  #    — ya sea el sensor de puerta O la luz/switch asociada
  - condition: template
    value_template: >
      {% set eid     = trigger.event.data.entity_id %}
      {% set puertas = parejas | map(attribute='p') | list %}
      {{ eid in puertas }}

  # 3. Estado cambió y es válido (on/off)
  #    Descarta: unavailable, unknown, cambios de atributos sin cambio de estado
  - condition: template
    value_template: >
      {% set ns = trigger.event.data.new_state.state %}
      {% set os = trigger.event.data.old_state.state %}
      {{ ns != os and ns in ['on', 'off'] }}

# ────────────────────────────────────────────────────────────────────────────
#  ACCIÓN
#
#  CASO A — Puerta ABRE (on):
#    Enciende la luz. Si t_ab != -1, apaga tras t_ab segundos
#    (solo si la puerta sigue abierta al vencer el timer).
#
#  CASO B — Puerta CIERRA (off):
#    Si t_ce != -1, apaga tras t_ce segundos
#    (solo si la puerta sigue cerrada al vencer el timer).
#
#  CASO C — Switch/Luz ON manual:
#    · Si la puerta está ABIERTA  → reinicia timer t_ab (igual que CASO A)
#    · Si la puerta está CERRADA  → aplica timer t_mc
#    En ambos casos solo si t != -1.
#
#  Resolución de tiempos: 0 → defecto global | -1 → ilimitado | otro → propio
# ────────────────────────────────────────────────────────────────────────────
action:
  - variables:
      eid:       "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state.state }}"
      auto_name: "{{ this.attributes.friendly_name | default(this.entity_id) }}"

  - repeat:
      for_each: "{{ parejas }}"
      sequence:

        # Resolver parámetros de esta pareja
        - variables:
            p:    "{{ repeat.item.p }}"
            l:    "{{ repeat.item.l }}"
            t_ab: >
              {{ repeat.item.a | int
                 if repeat.item.a | int != 0
                 else t_ab_def | int }}
            t_ce: >
              {{ repeat.item.c | int
                 if repeat.item.c | int != 0
                 else t_ce_def | int }}
            t_mc: >
              {{ repeat.item.m | int
                 if repeat.item.m | int != 0
                 else t_mc_def | int }}
            par:  "{{ repeat.index }}"

        - choose:

            # ════════════════════════════════════════════════════════════════
            #  CASO A — PUERTA ABRE → encender luz + timer apertura
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'on' }}"
              sequence:
                - if:
                    - "{{ states(p) in ['unavailable', 'unknown'] }}"
                  then:
                    - service: system_log.write
                      data:
                        level: warning
                        logger: "blueprint.puerta_luz"
                        message: >
                          [{{ auto_name }}] Pareja {{ par }} — OMITIDO Puerta→Luz:
                          Sensor '{{ p }}' no disponible ({{ states(p) }}).
                          Verifica batería o conectividad del sensor.
                  else:
                    - service: homeassistant.turn_on
                      target: "{{ l }}"
                    - service: system_log.write
                      data:
                        level: info
                        logger: "blueprint.puerta_luz"
                        message: >
                          [{{ auto_name }}] Pareja {{ par }} — Puerta ABIERTA →
                          Luz encendida.
                          Timer apertura: {{ 'ilimitado' if t_ab == -1 else t_ab | string ~ 's' }}.
                    - if:
                        - "{{ t_ab | int != -1 }}"
                      then:
                        - delay:
                            seconds: "{{ t_ab | int }}"
                        - if:
                            - "{{ states(p) == 'on' }}"
                          then:
                            - service: homeassistant.turn_off
                              target: "{{ l }}"
                            - service: system_log.write
                              data:
                                level: info
                                logger: "blueprint.puerta_luz"
                                message: >
                                  [{{ auto_name }}] Pareja {{ par }} — Timer apertura
                                  agotado ({{ t_ab }}s), puerta aún abierta → Luz apagada.
                          else:
                            - service: system_log.write
                              data:
                                level: info
                                logger: "blueprint.puerta_luz"
                                message: >
                                  [{{ auto_name }}] Pareja {{ par }} — Timer apertura
                                  vencido pero puerta ya cerrada. Control → timer cierre.

            # ════════════════════════════════════════════════════════════════
            #  CASO B — PUERTA CIERRA → timer de apagado tras cierre
            # ════════════════════════════════════════════════════════════════
            - conditions:
                - "{{ eid == p and new_state == 'off' }}"
              sequence:
                - service: system_log.write
                  data:
                    level: info
                    logger: "blueprint.puerta_luz"
                    message: >
                      [{{ auto_name }}] Pareja {{ par }} — Puerta CERRADA.
                      Timer cierre: {{ 'nunca (ilimitado)' if t_ce == -1 else t_ce | string ~ 's' }}.
                - if:
                    - "{{ t_ce | int != -1 }}"
                  then:
                    - delay:
                        seconds: "{{ t_ce | int }}"
                    - if:
                        - "{{ states(p) == 'off' }}"
                      then:
                        - service: homeassistant.turn_off
                          target: "{{ l }}"
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.puerta_luz"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Timer cierre
                              agotado ({{ t_ce }}s) → Luz apagada.
                      else:
                        - service: system_log.write
                          data:
                            level: info
                            logger: "blueprint.puerta_luz"
                            message: >
                              [{{ auto_name }}] Pareja {{ par }} — Timer cierre
                              cancelado: puerta volvió a abrirse. Control → timer apertura.

# ────────────────────────────────────────────────────────────────────────────
#  MODO DE EJECUCIÓN
#
#  restart     : cancela el delay activo y reinicia la automatización cuando
#                llega un nuevo evento. Garantiza que:
#                  · Timer apertura se cancela si la puerta cierra antes
#                  · Timer cierre se cancela si la puerta abre antes
#                  · Timer manual se cancela si la puerta cambia de estado
#                  · Nunca quedan timers huérfanos corriendo en paralelo
#
#  max_exceeded silent : descarta silenciosamente ante sobrecarga.
# ────────────────────────────────────────────────────────────────────────────
mode: restart
max_exceeded: silent
