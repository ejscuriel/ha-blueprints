# ║         BLUEPRINT: Puerta → Luz / Interruptor con Temporización            ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  Descripción : Vincula hasta 10 parejas sensor de puerta ↔ luz/switch.     ║
# ║                Al abrir la puerta enciende la luz durante el tiempo         ║
# ║                configurado. Al cerrar, la mantiene encendida un tiempo      ║
# ║                adicional antes de apagarla automáticamente.                 ║
# ║                Tiempo -1 = encendido indefinido (sin temporizador).         ║
# ║                                                                             ║
